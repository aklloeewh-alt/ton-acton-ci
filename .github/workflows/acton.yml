name: acton-tests
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Acton
        uses: ton-blockchain/setup-acton@bb72b7a97df8c5203d6778ebaf773690990a09d0
      - name: Clone nominator-pool-v2
        run: git clone --depth 1 https://github.com/ton-blockchain/nominator-pool-v2 npv2
      - name: Add our PoC test
        run: cp poc/poc/poc_invariants.test.tolk npv2/tests/
      - name: Build+test nominator-pool-v2
        run: |
          (cd npv2 && acton up 1.2.0 && acton build && acton test) > /tmp/test.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 /tmp/test.log | tr '\n' ' ')
            echo "::error::$msg"
          fi
          exit $rc
      - name: Clone acton-contracts
        run: git clone --depth 1 https://github.com/ton-blockchain/acton-contracts acton
      - name: Build acton-contracts
        run: cd acton && acton up 1.2.0 && acton build
      - name: Test jetton v2.1
        run: cd acton && acton test jetton-v2.1/tests
      - name: Test nft v1.1
        run: cd acton && acton test nft-v1.1/tests
      - name: Clone tg-wallet
        run: git clone --depth 1 https://github.com/ton-blockchain/tg-wallet-contract tgw
      - name: Build+test tg-wallet
        run: cd tgw && acton up 1.2.0 && acton build && acton test
