name: acton-tests
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Acton
        uses: ton-blockchain/setup-acton@bb72b7a97df8c5203d6778ebaf773690990a09d0
      - name: Clone target
        run: git clone --depth 1 https://github.com/ton-blockchain/nominator-pool-v2 target
      - name: Build
        run: cd target && acton build
      - name: Test
        run: cd target && acton test
